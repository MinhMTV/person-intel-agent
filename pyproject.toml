[project]
name = "person-intel-agent"
dynamic = ["version"]
description = "Image-first OSINT candidate discovery and verification"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",   # long strings/HTML are formatted by hand
    "B008",   # FastAPI dependency defaults
    "S101",   # asserts in tests
    "S311",   # non-crypto random is fine
    "S603", "S607",  # subprocess for playwright install
    "UP007",
    "UP035",
    "UP042",  # (str, Enum) keeps str() semantics stable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["^tests/", "^data/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
